name: Fetch, Build and Test, VSIX (Release on tag)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  metadata:
    name: Validate Release Metadata
    runs-on: windows-2025-vs2026
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      is_test: ${{ steps.release.outputs.is_test }}
      tag: ${{ steps.release.outputs.tag }}
      package_version: ${{ steps.release.outputs.package_version }}
      notes_start_tag: ${{ steps.release.outputs.notes_start_tag }}
      latest_stable_tag: ${{ steps.release.outputs.latest_stable_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: release
        shell: pwsh
        run: pwsh.exe -NoProfile -File .github/get-release-metadata.ps1

  # -------------------------------
  # Job 1: Fetch required assets
  # -------------------------------
  fetch-docs:
    name: Fetch Docs and Web Assets
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download latest cs-webview release (private repo)
        shell: pwsh
        run: powershell.exe -File .github/cwf.ps1 -Token "$env:CODESCENE_IDE_DOCS_AND_WEBVIEW_TOKEN"
        env:
          CODESCENE_IDE_DOCS_AND_WEBVIEW_TOKEN: ${{ secrets.CODESCENE_IDE_DOCS_AND_WEBVIEW_TOKEN }}

      - name: Get latest Codescene CLI version
        shell: pwsh
        run: powershell.exe -File .github/cli.ps1

      - name: Upload fetched assets
        uses: actions/upload-artifact@v4
        with:
          name: fetched-assets
          path: |
            cs-cwf/**
            cs-ide/**

  # -------------------------------
  # Job 2: Build and Test
  # -------------------------------
  build-test:
    name: Build and Test VSIX
    runs-on: windows-2025-vs2026
    needs:
      - metadata
      - fetch-docs
    # env:
      # Feature flags here. Example:
      # FEATURE_INITIAL_GIT_OBSERVER: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject test release version
        if: needs.metadata.outputs.is_test == 'true'
        shell: pwsh
        run: |
          Import-Module .github/release-version.psm1 -Force
          Set-PackageVersion -RepositoryPath . -Version '${{ needs.metadata.outputs.package_version }}'

      - name: Check PR size
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git fetch origin main:main
          powershell.exe -File .github/pr-size.ps1

      - name: Download fetched assets
        uses: actions/download-artifact@v4
        with:
          name: fetched-assets
          path: .

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1

      - name: Copy web assets into project
        shell: pwsh
        run: powershell.exe -File .github/copy-assets.ps1

      - name: Restore NuGet packages
        run: dotnet restore Codescene.VSExtension.VS2022/Codescene.VSExtension.sln

      - name: Build solution
        run: msbuild Codescene.VSExtension.VS2022/Codescene.VSExtension.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Run unit tests
        if: ${{ hashFiles('**/*Tests.dll') != '' }}
        run: dotnet test Codescene.VSExtension.VS2022/Codescene.VSExtension.sln --configuration Release --no-build --results-directory ./Codescene.VSExtension.VS2022/TestResults/ --logger trx --collect "XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=lcov
          
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: "**/*.trx"
          reporter: dotnet-trx

      - name: Install ReportGenerator
        if: always()
        shell: pwsh
        run: dotnet tool install -g dotnet-reportgenerator-globaltool   
      
      - name: Merge coverage
        if: always()
        shell: pwsh
        run: |
          reportgenerator `
          -reports:"**/TestResults/**/coverage.info" `
          -targetdir:./Codescene.VSExtension.VS2022/TestResults/coverage-report/ `
          -reporttypes:lcov   
       
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx
            **/coverage-report/lcov.info

      - name: Name test VSIX artifact
        if: needs.metadata.outputs.is_test == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Recurse -Filter *.vsix)
          if ($files.Count -ne 1) {
            throw "Expected exactly one VSIX file, found $($files.Count)."
          }
          $target = Join-Path $files[0].DirectoryName "codescene-vs-${{ needs.metadata.outputs.tag }}.vsix"
          Move-Item $files[0].FullName $target

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '**/*.vsix'
          
      - name: Check code coverage
        uses: ./.github/actions/check-coverage
        if: always()
        with:
          access-token: ${{ secrets.CODESCENE_CODE_COVERAGE_API_TOKEN }}
          project-url: "https://api.codescene.io/v2/projects/66574"
          coverage-files: "**/coverage-report/lcov.info"

  # -------------------------------
  # Job 3: Release
  # -------------------------------
  release:
    name: Create GitHub Release
    runs-on: windows-2025-vs2026
    needs:
      - metadata
      - build-test
    if: needs.metadata.outputs.is_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: .

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem -Recurse -Filter *.vsix | ForEach-Object FullName)
          if ($files.Count -eq 0) {
            throw "No VSIX files found."
          }

          $arguments = @(
            "release",
            "create",
            "${{ needs.metadata.outputs.tag }}"
          )
          $arguments += $files
          $arguments += @("--generate-notes", "--verify-tag")

          $notesStartTag = "${{ needs.metadata.outputs.notes_start_tag }}"
          if ($notesStartTag) {
            $arguments += @("--notes-start-tag", $notesStartTag)
          }

          if ("${{ needs.metadata.outputs.is_test }}" -eq "true") {
            $arguments += @("--prerelease", "--latest=false")
            $latestStableTag = "${{ needs.metadata.outputs.latest_stable_tag }}"
            if ($latestStableTag) {
              $compareUrl = "https://github.com/${{ github.repository }}/compare/$latestStableTag...${{ needs.metadata.outputs.tag }}"
              $arguments += @("--notes", "[Changes since $latestStableTag]($compareUrl)")
            }
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
